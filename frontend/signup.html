<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotional Pet - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="bg-body-tertiary auth-body">
    <header class="hero-gradient text-white auth-hero">
      <div class="container py-4 d-flex justify-content-between align-items-center">
        <a class="brand-link d-flex align-items-center gap-3 text-decoration-none text-white" href="index.html">
          <div class="rounded-circle bg-white bg-opacity-25 text-white px-3 py-2 fw-bold">EP</div>
          <div>
            <div class="fw-semibold">Emotional Pet</div>
            <small class="text-white-50">Create your account</small>
          </div>
        </a>
        <div class="d-flex align-items-center gap-3">
          <a class="nav-link nav-link-light" href="login.html">Log in</a>
        </div>
      </div>
    </header>

    <main class="container auth-wrapper">
      <div class="auth-card card panel">
        <div class="card-body">
          <h1 class="h4 mb-1 text-center">Sign up</h1>
          <p class="text-muted text-center mb-4">Start your emotional pet journey</p>
          <form>
            <div class="mb-3">
              <label for="signupName" class="form-label">Name</label>
              <input type="text" class="form-control" id="signupName" placeholder="Your name">
            </div>
            <div class="mb-3">
              <label for="signupEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="signupEmail" placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label for="signupPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="signupPassword" placeholder="••••••••">
            </div>
            <div class="mb-4">
              <label for="signupConfirm" class="form-label">Confirm password</label>
              <input type="password" class="form-control" id="signupConfirm" placeholder="••••••••">
            </div>
            <div class="d-grid mb-3">
              <button type="button" class="btn btn-primary">Create account</button>
            </div>
            <p class="text-center text-muted mb-0">
              Already have an account? <a href="login.html" class="text-decoration-none">Log in</a>
            </p>
          </form>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
