<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotional Pet - History & Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="bg-body-tertiary">
    <header class="hero-gradient text-white">
      <div class="container py-4 d-flex justify-content-between align-items-center">
        <a class="brand-link d-flex align-items-center gap-2 text-decoration-none text-white" href="index.html">
          <div class="rounded-circle bg-white bg-opacity-25 text-white px-3 py-2 fw-bold">EP</div>
          <div>
            <div class="fw-semibold">Emotional Pet</div>
            <small class="text-white-50">History & Report</small>
          </div>
        </a>
        <nav class="d-flex gap-3 align-items-center">
          <a class="nav-link nav-link-light" href="index.html">Home</a>
          <a class="nav-link nav-link-light" href="history-report.html">History</a>
          <a class="d-flex flex-column align-items-center gap-1 user-meta text-decoration-none" href="user-profile.html">
            <div class="avatar-sm bg-white bg-opacity-25 rounded-circle"></div>
            <span class="fw-semibold text-white">Username</span>
          </a>
          <button class="btn btn-outline-light btn-sm">Logout</button>
        </nav>
      </div>
    </header>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-12 col-xl-6">
          <div class="card panel h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h6 text-uppercase text-muted mb-0">Reports</h2>
                <small class="text-muted">Tap a date to view</small>
              </div>
              <div id="reportLinks" class="d-flex flex-column gap-2">
                <small class="text-muted">No reports yet.</small>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-xl-6">
          <div class="card panel h-100">
            <div class="card-body">
              <h2 class="h6 text-uppercase text-muted mb-3">Weekly trend</h2>
              <div class="ratio ratio-16x9 bg-body-secondary rounded d-flex align-items-center justify-content-center">
                <span class="text-muted">Chart placeholder</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="reportModalTitle">Report</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="reportModalBody">
            Loading report...
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      const reportLinks = document.getElementById("reportLinks");
      const modalEl = document.getElementById("reportModal");
      const modalTitle = document.getElementById("reportModalTitle");
      const modalBody = document.getElementById("reportModalBody");
      const modal = modalEl ? new bootstrap.Modal(modalEl) : null;

      const today = new Date();
      const formatDate = (d) =>
        d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });

      // Placeholder reports; replace with real data later.
      const reports = [
        { label: formatDate(today), id: "RPT-TODAY", summary: "Today’s mood summary goes here." },
        { label: "Aug 31, 2024", id: "RPT-002", summary: "Mood trends and pet status for Aug 31." },
        { label: "Aug 30, 2024", id: "RPT-001", summary: "Mood trends and pet status for Aug 30." },
      ];

      if (reportLinks && reports.length) {
        reportLinks.innerHTML = "";
        reports.forEach((report) => {
          const btn = document.createElement("button");
          btn.className = "btn btn-outline-secondary text-start";
          btn.textContent = `View report • ${report.label}`;
          btn.addEventListener("click", () => {
            if (!modal) return;
            modalTitle.textContent = `Report - ${report.label}`;
            modalBody.innerHTML = `
              <div class="text-center">
                <div class="pet-portrait mx-auto mb-4"></div>
                <div class="chart-box mx-auto mb-3">
                  <span class="text-muted">Chart placeholder (pie or line)</span>
                </div>
                <p class="text-muted mb-1">Report ID: ${report.id}</p>
                <p>${report.summary}</p>
                <p class="mb-0 text-muted small">Click close to dismiss.</p>
              </div>
            `;
            modal.show();
          });
          reportLinks.appendChild(btn);
        });
      }
    </script>
  </body>
</html>
