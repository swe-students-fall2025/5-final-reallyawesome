name: MongoDB CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MongoDB image (test only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/mongo
          push: false
          tags: marketplace-mongo:test

      - name: Login to Docker Hub
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push MongoDB image
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/mongo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-mongo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-mongo:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.DO_HOST != '' && secrets.DO_SSH_KEY != '' && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-mongo:latest
            docker stop marketplace-mongo || true
            docker rm marketplace-mongo || true
            docker run -d \
              --name marketplace-mongo \
              --restart unless-stopped \
              -p 27017:27017 \
              -v /data/mongodb:/data/db \
              ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-mongo:latest
