name: MongoDB CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MongoDB image (test only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/mongo
          push: false
          tags: marketplace-mongo:test

      - name: Login to Docker Hub
        # Only runs on main/master pushes; avoid referencing secrets in the condition to prevent invalid workflow errors
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push MongoDB image
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/mongo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-mongo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-mongo:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
      DO_MONGO_APP_ID: ${{ secrets.DO_MONGO_APP_ID }}
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.DO_API_TOKEN != '' && env.DO_MONGO_APP_ID != '' }}
    steps:
      - name: Trigger DigitalOcean App Platform deployment (mongo)
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${DO_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/apps/${DO_MONGO_APP_ID}/deployments"
