<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secondhand Marketplace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Auth.css') }}">
</head>
<body class="cyber-auth">
    <div class="data-mesh"></div>
    <div class="scanline-overlay"></div>
    <div class="auth-orb orb-top"></div>
    <div class="auth-orb orb-bottom"></div>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-header">
                <div class="logo">⚡️</div>
                <h1 class="glitch-text" data-text="ACCESS TERMINAL">ACCESS TERMINAL</h1>
                <p class="tagline">Connect to the neon campus exchange channel</p>
            </div>
            <div class="neon-divider"></div>

            <!-- Login form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" 
                           placeholder="id@nyu.edu" required>
                    <span class="form-hint">Use the campus email you registered with</span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" 
                           placeholder="Enter password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Keep me signed in</span>
                    </label>
                    <a href="#" class="link" id="forgotPasswordLink">Reset password</a>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Sign in</span>
                    <span class="btn-loading" style="display: none;">
                        <span class="spinner"></span> Processing...
                    </span>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <button type="button" class="btn btn-secondary" id="wechatLoginBtn">
                    💬 WeChat login
                </button>

                <div class="auth-footer">
                    Don't have an account? <a href="{{ url_for('register_page') }}" class="link">Create access</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
